    <script>
        let pahoConfig = {
            hostname: "test.mosquitto.org",
            port: "8081", //The port number is the WebSocket-Port,
            // not (!) the MQTT-Port. This is a Paho characteristic.
            clientId: "ClientId_" + Math.random().toString()
        }
        let connectOptions = {
            userName: "",
            password: "",
            useSSL: true,
            reconnect: true,
            onSuccess: onConnect
        }


        let reconnecting = false;
        // Function to build and establish connection with current variables
        function reconnectMqtt() {

            updateMqttStatus(false);

            // 1. Prevent disconnect-connect loop
            if (typeof client !== 'undefined') {
                client.onConnectionLost = function () { };
                client.onMessageArrived = function () { };

                if (client.isConnected()) {
                    console.log("Disconnecting old client cleanly...");
                    client.disconnect();
                }
            }

            // 2. Abort if host/port is missing
            if (!mqttHost || !mqttPort) {
                console.warn("MQTT connection aborted: Host or Port is missing.");
                return;
            }

            // 3. Build pahoConfig based on saved settings
            let pahoConfig = {
                hostname: mqttHost,
                port: Number(mqttPort)
            };

            // 4. Initialize client (randomized clientId to avoid conflicts)
            const clientId = "heSonarWeb_" + Math.random().toString(16).substr(2, 8);
            client = new Paho.Client(pahoConfig.hostname, pahoConfig.port, clientId);

            // Assign your callbacks for the NEW client
            client.onConnectionLost = onConnectionLost;
            client.onMessageArrived = onMessageArrived;

            // 5. Build connectOptions
            let connectOptions = {
                useSSL: mqttSsl,
                timeout: 3,
                onSuccess: onConnect,
                onFailure: function (message) {
                    console.error("Connection failed: " + message.errorMessage);
                    updateMqttStatus(false);
                    // Automatyczna próba ponownego połączenia przy błędzie
                    setTimeout(reconnectMqtt, 5000);
                }
            };

            // 6. Add User and Password ONLY if they are not empty strings
            if (mqttUser !== "") {
                connectOptions.userName = mqttUser;
            }
            if (mqttPass !== "") {
                connectOptions.password = mqttPass;
            }

            // 7. Attempt connection
            console.log("Connecting to broker...", pahoConfig);
            client.connect(connectOptions);
        }

        function onConnect() {
            console.log("Connected with Server");
            client.subscribe("helium/" + deviceID + "/sonarPing");
            console.log("subscribe to : " + "helium/" + deviceID + "/sonarPing");
            updateMqttStatus(true);
        }

        function onConnectionLost(responseObject) {
            console.log("connection lost :(");
            if (responseObject.errorCode !== 0) {
                console.log("onConnectionLost:" + responseObject.errorMessage);
            }
            else console.log("onConnectionLost1:" + responseObject.errorMessage);
            updateMqttStatus(false);
            reconnectMqtt();
        }

        function onMessageArrived(message) {
            console.log("onMessageArrived:" + message.payloadString);
            parseMQTT(message.payloadString);
        }


        var hotspots = [];

        function parseMQTT(message) {

            hotspots = [];
            document.getElementById('payloadRAW').value = message;


            var msg = JSON.parse(message);

            document.getElementById('hotspotsRAW').value = msg.hotspots;

            var temp_s = msg.hotspots;
            var temp = temp_s.split(';').filter(Boolean);; // split for each hotspots + filter out empty elements
            //console.log("text split into: " + temp.length);



            temp.forEach(function (value, i) {
                //console.log('%d: %s', i, value);
                var temp2 = value.split(','); // get hotspot fields
                hotspots.push({
                    "name": temp2[0],
                    "rssi": parseFloat(temp2[1]).toFixed(1),
                    "snr": parseFloat(temp2[2]).toFixed(1)
                });
            });

            // console.log("hotspots [] size: " + hotspots.length);

            // console.log("------------------\n" + JSON.stringify(hotspots) + "\n-------------------------------");
            // hotspots.forEach(function (value, i) {
            //     console.log('%s : %s : %s', value.name, value.rssi, value.snr);
            // });

            //sort by SNR
            hotspots.sort((a, b) => parseFloat(b.snr) - parseFloat(a.snr));
            // console.log("------------------\n" + JSON.stringify(hotspots) + "\n-------------------------------");
            // hotspots.forEach(function (value, i) {
            //     console.log('%s : %s : %s', value.name, value.rssi, value.snr);
            // });

            update_progress(hotspots[0].snr, hotspots[0].rssi);
            getScores();
        }
    </script>

    <script>
        // Global configuration variables
        let mqttPreset = "";
        let mqttHost = "";
        let mqttPort = "";
        let mqttSsl = false;
        let mqttUser = "";
        let mqttPass = "";
        let deviceID = "";

        // Broker presets definition (WebSockets ports)
        const brokerPresets = {
            mosquitto_ws: {host: "test.mosquitto.org", port: "8080", ssl: false},
            mosquitto_wss: {host: "test.mosquitto.org", port: "8081", ssl: true},
            emqx_ws: {host: "broker.emqx.io", port: "8083", ssl: false},
            emqx_wss: {host: "broker.emqx.io", port: "8084", ssl: true},
            hivemq_ws: {host: "broker.hivemq.com", port: "8000", ssl: false}
        };

        // Toggles the settings modal visibility
        function toggleSettings() {
            const modal = document.getElementById('settings-modal');
            if (modal.style.display === 'none' || modal.style.display === '') {
                // Load current data into the form
                document.getElementById('input-preset').value = mqttPreset || "mosquitto_ws";
                document.getElementById('input-host').value = mqttHost;
                document.getElementById('input-port').value = mqttPort;
                document.getElementById('input-ssl').checked = mqttSsl;
                document.getElementById('input-user').value = mqttUser;
                document.getElementById('input-pass').value = mqttPass;
                document.getElementById('input-device').value = deviceID;

                // Apply lock/unlock logic based on current preset
                applyPreset(false);

                modal.style.display = 'flex';
            } else {
                modal.style.display = 'none';
            }
        }

        // Applies the selected preset to the input fields
        function applyPreset(overwriteFields = true) {
            const presetSelect = document.getElementById('input-preset').value;
            const hostInput = document.getElementById('input-host');
            const portInput = document.getElementById('input-port');
            const sslInput = document.getElementById('input-ssl');

            if (presetSelect !== "custom") {
                // Lock fields and auto-fill if a preset is selected
                hostInput.readOnly = true;
                portInput.readOnly = true;
                sslInput.disabled = true;

                if (overwriteFields && brokerPresets[presetSelect]) {
                    hostInput.value = brokerPresets[presetSelect].host;
                    portInput.value = brokerPresets[presetSelect].port;
                    sslInput.checked = brokerPresets[presetSelect].ssl;
                }
            } else {
                // Unlock fields for custom configuration
                hostInput.readOnly = false;
                portInput.readOnly = false;
                sslInput.disabled = false;
            }
        }

        // Saves settings to localStorage and triggers reconnection
        function saveSettings() {
            localStorage.setItem('heSonar_preset', document.getElementById('input-preset').value);
            localStorage.setItem('heSonar_host', document.getElementById('input-host').value.trim());
            localStorage.setItem('heSonar_port', document.getElementById('input-port').value.trim());
            localStorage.setItem('heSonar_ssl', document.getElementById('input-ssl').checked);
            localStorage.setItem('heSonar_user', document.getElementById('input-user').value.trim());
            localStorage.setItem('heSonar_pass', document.getElementById('input-pass').value.trim());
            localStorage.setItem('heSonar_deviceID', document.getElementById('input-device').value.trim());

            loadSettings();
            toggleSettings();

            // Call the connection restart function
            reconnectMqtt();
        }

        // Loads settings from localStorage and updates UI indicators
        function loadSettings() {
            mqttPreset = localStorage.getItem('heSonar_preset') || "mosquitto_wss";
            mqttHost = localStorage.getItem('heSonar_host') || "test.mosquitto.org";
            mqttPort = localStorage.getItem('heSonar_port') || "8081";
            mqttSsl = localStorage.getItem('heSonar_ssl') === 'true';
            mqttUser = localStorage.getItem('heSonar_user') || "";
            mqttPass = localStorage.getItem('heSonar_pass') || "";
            deviceID = localStorage.getItem('heSonar_deviceID') || "";

            const statusBroker = document.getElementById('status-broker');
            const statusDevice = document.getElementById('status-device');

            if (mqttHost && mqttPort) {
                statusBroker.innerHTML = `🟢 ${mqttHost}:${mqttPort}`;
                statusBroker.style.background = "#28a745";
            } else {
                statusBroker.innerHTML = "🔴 No Broker";
                statusBroker.style.background = "#dc3545";
            }

            if (deviceID) {
                statusDevice.innerHTML = "🟢 Device ID OK";
                statusDevice.style.background = "#28a745";
            } else {
                statusDevice.innerHTML = "🔴 No Device ID";
                statusDevice.style.background = "#dc3545";
            }
        }

        // Helper function to update the connection status indicator
        function updateMqttStatus(isConnected) {
            const statusMqtt = document.getElementById('status-mqtt');
            if (isConnected) {
                statusMqtt.innerHTML = "🟢 MQTT Connected";
                statusMqtt.style.background = "#28a745";
            } else {
                statusMqtt.innerHTML = "🔴 MQTT Disconnected";
                statusMqtt.style.background = "#dc3545";
            }
        }

        window.onload = function () {
            loadSettings();
            // Initial connection trigger
            if (mqttHost && mqttPort) {
                reconnectMqtt();
            }
        };
    </script>

    <script>
        // map rssi and snr to 0-100% progress bar
        function map_progbar(value, type) {
            const SNR_MAX = 20;
            const SNR_MIN = -20;
            const RSSI_MAX = 0;
            const RSSI_MIN = -145;
            const PRBAR_ZERO = 50; // middle of the bar, = 0dB
            const PRBAR_MAX = 100;
            const PRBAR_MIN = 0;

            let bar = 0;

            let min = SNR_MIN;
            let max = SNR_MAX;
            if (type == 'rssi') {
                min = RSSI_MIN;
                max = RSSI_MAX;
            }

            if (type == "snr") {
                if (value > 0) bar = ((PRBAR_MAX - PRBAR_ZERO) * value / max) + PRBAR_ZERO;
                else if (value < 0) bar = PRBAR_ZERO + ((PRBAR_ZERO - PRBAR_MIN) * value / max);
                else bar = PRBAR_ZERO;
            }
            else { // rssi
                bar = PRBAR_MAX - ((value * PRBAR_MAX) / RSSI_MIN);
            }

            //console.log("mapping: " + value);
            //console.log(" to " + bar);
            return bar;

        }

        // Progress bar update
        function update_progress(snr, rssi) {
            //console.log("PROGRESS UPDATE: " + snr + " / " + rssi);
            $("#progress_snr").css('width', map_progbar(snr, "snr") + '%');
            $('#snr_text').text(snr + "dB");
            $("#progress_rssi").css('width', map_progbar(rssi, "rssi") + '%');
            $('#rssi_text').text(rssi + "dB");
        }

        // create table
        //---------------------------------------------------------------------------------------
        const scoreDiv = document.querySelector("div.scoreboard")
        let tableHeaders = ["#", "hotspot-name", "SNR [dB]", "RSSI [dB]"]

        const createScoreboardTable = () => {
            while (scoreDiv.firstChild) scoreDiv.removeChild(scoreDiv.firstChild)

            let scoreboardTable = document.createElement('table')
            scoreboardTable.className = 'table table-success table-striped fs-2'
            let scoreboardTableHead = document.createElement('thead')
            let scoreboardTableHeaderRow = document.createElement('tr')
            tableHeaders.forEach(header => {
                let scoreHeader = document.createElement('th')
                scoreHeader.innerText = header
                scoreboardTableHeaderRow.append(scoreHeader)
            })
            scoreboardTableHead.append(scoreboardTableHeaderRow)
            scoreboardTable.append(scoreboardTableHead)
            let scoreboardTableBody = document.createElement('tbody')
            scoreboardTable.append(scoreboardTableBody)
            scoreDiv.append(scoreboardTable)
        }

        const appendScores = (singleScore, singleScoreIndex) => {
            const scoreboardTable = document.querySelector('tbody')
            let scoreboardTableBodyRow = document.createElement('tr')
            let scoreRanking = document.createElement('td')
            scoreRanking.innerText = singleScoreIndex
            let usernameData = document.createElement('td')
            usernameData.innerText = singleScore.name
            let scoreData = document.createElement('td')
            scoreData.innerText = singleScore.snr
            let timeData = document.createElement('td')
            timeData.innerText = singleScore.rssi
            scoreboardTableBodyRow.append(scoreRanking, usernameData, scoreData, timeData)
            scoreboardTable.append(scoreboardTableBodyRow)
        }

        const getScores = () => {
            createScoreboardTable()
            for (const score of hotspots) {
                let scoreIndex = hotspots.indexOf(score) + 1
                appendScores(score, scoreIndex)
            }
        }
        //---------------------------------------------------------------------------------------
    </script>
